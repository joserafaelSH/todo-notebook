name: Release

# Manual: Actions > Release > Run workflow. Creates the tag v<version> and a GitHub Release with the zip attached.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the "v" (e.g. 1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish
        shell: pwsh
        run: ./publish.ps1 -SelfContained

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist\* -DestinationPath TodoNotebook-win-x64.zip

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ inputs.version }}
          name: Todo Notebook v${{ inputs.version }}
          files: TodoNotebook-win-x64.zip
          generate_release_notes: true
