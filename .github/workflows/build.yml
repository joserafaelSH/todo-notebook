name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Self-contained single-file exe into .\dist
      - name: Publish
        shell: pwsh
        run: ./publish.ps1 -SelfContained

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist\* -DestinationPath TodoNotebook-win-x64.zip

      - uses: actions/upload-artifact@v6
        with:
          name: TodoNotebook-win-x64
          path: TodoNotebook-win-x64.zip
          if-no-files-found: error

  release:
    # Only for tags like v1.0.0: attaches the zip to a GitHub Release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: TodoNotebook-win-x64

      - uses: softprops/action-gh-release@v3
        with:
          files: TodoNotebook-win-x64.zip
          generate_release_notes: true
